name: Fetch Market Rates & Generate Chart

on:
  workflow_dispatch: # Trigger manually

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml cloudscraper matplotlib

      - name: Run script
        run: python fetch_rates.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market.json usd_chart.png

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update market.json and chart"
            git push
          fi
